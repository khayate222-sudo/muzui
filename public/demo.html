<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サロンサイトの制作デモ | muzui studio</title><link rel="stylesheet" href="/demo.css"><script type="module" src="/demo.js"></script></head><body>
<div class="demo-toolbar"><a href="/">← muzui studio</a><p>架空サロンの制作サンプル <span>料金・営業時間・イラストは例です</span></p><button id="edit-toggle" type="button" aria-expanded="false" aria-controls="editor-panel">自分のお店で試す</button></div>
<aside class="editor-panel" id="editor-panel" hidden><div class="editor-heading"><div><p>TRY YOUR SALON</p><h2>あなたのお店に置き換える</h2></div><button type="button" id="close-editor" aria-label="編集画面を閉じる">×</button></div><p class="editor-note">入力・写真は端末内で処理します。送信や注文はされません。保存したHTMLは、お手元での確認用です。</p><form id="salon-form"><label for="name">サロン名</label><input id="name" name="name" maxlength="80"><label for="tagline">キャッチコピー</label><textarea id="tagline" name="tagline" maxlength="200" rows="2"></textarea><label for="intro">紹介文</label><textarea id="intro" name="intro" maxlength="1000" rows="4"></textarea><fieldset><legend>メニュー・料金</legend><div class="editor-row"><input name="menu1" aria-label="メニュー1" maxlength="80"><input name="price1" aria-label="メニュー1の料金" maxlength="80"></div><div class="editor-row"><input name="menu2" aria-label="メニュー2" maxlength="80"><input name="price2" aria-label="メニュー2の料金" maxlength="80"></div><div class="editor-row"><input name="menu3" aria-label="メニュー3" maxlength="80"><input name="price3" aria-label="メニュー3の料金" maxlength="80"></div></fieldset><label for="hours">営業時間・定休日</label><input id="hours" name="hours" maxlength="200"><label for="access-input">アクセス</label><textarea id="access-input" name="access" maxlength="500" rows="3"></textarea><label for="booking">予約先のURL（HTTPS）</label><input id="booking" name="booking" type="url" maxlength="1000" placeholder="https://lin.ee/..."><label for="photos">サロンの写真（最大3枚）</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="editor-note">使用許可のある写真のみ。1枚5MBまで。写真は保存用に軽量化します。</p><button class="editor-primary" type="submit" disabled>プレビューに反映</button><button id="download" type="button" class="editor-secondary">この内容で確認用HTMLを保存</button><a class="editor-consult" href="/#consult">このデザインで制作を相談する →</a><p id="editor-status" role="status" aria-live="polite"></p></form></aside>
<div id="salon-preview"></div><div class="demo-bottom"><p>このデザインをベースに、お店の情報で仕上げます。</p><a href="/#plan">制作プランを見る · 5,000円 →</a></div>
</body></html>
