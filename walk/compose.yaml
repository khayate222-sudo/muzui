services:
  walk:
    build: .
    ports:
      - "3001:3001"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_KEY: ${ADMIN_KEY:-}
    volumes:
      - walk-data:/app/data
    restart: unless-stopped
volumes:
  walk-data:
